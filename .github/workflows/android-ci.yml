name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Write local.properties (Igor config)
        env:
          IGOR_BASE_URL: ${{ secrets.IGOR_BASE_URL }}
          IGOR_API_KEY: ${{ secrets.IGOR_API_KEY }}
        run: |
          cat >> local.properties <<EOF
          IGOR_BASE_URL=$IGOR_BASE_URL
          IGOR_API_KEY=$IGOR_API_KEY
          EOF

      - name: Write google-services.json (Firebase)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Firebase config written."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; building without Firebase."
          fi

      - name: Smoke-test Igor reachability
        env:
          IGOR_BASE_URL: ${{ secrets.IGOR_BASE_URL }}
          IGOR_API_KEY: ${{ secrets.IGOR_API_KEY }}
        continue-on-error: true
        run: |
          if [ -z "$IGOR_BASE_URL" ]; then
            echo "IGOR_BASE_URL not set; skipping reachability check."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -H "X-API-Key: $IGOR_API_KEY" -H "Accept: application/json" \
            "${IGOR_BASE_URL%/}/academic/schedule")
          echo "GET /academic/schedule -> HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Igor reachable and key accepted."
          else
            echo "::warning::Igor did not return 2xx (got $code). The app still builds and degrades to offline mode; this step never fails the build."
          fi

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ultron-wear-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
