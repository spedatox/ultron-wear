[versions]
# ── Build tooling ────────────────────────────────────────────────────────────
# AGP is deliberately held on the 8.x line rather than 9.3.x. AGP 9 is a
# build-system release (keep-rule source sets, built-in Kotlin, Gradle 9
# baseline) — it changes nothing the watch executes at runtime, so taking it
# would buy zero performance and cost a DSL migration. Every dependency that
# does affect what runs on the wrist is pinned to current stable below.
agp = "8.13.2"
kotlin = "2.3.21"

# ── Compose & Wear ───────────────────────────────────────────────────────────
composeBom = "2026.06.01"
# Wear Compose 1.6.2 — note this project uses compose-material3, NOT the
# superseded compose-material. See app/build.gradle.kts.
wearCompose = "1.6.2"
tiles = "1.5.0"
watchface = "1.2.1"
wearCore = "1.3.0"

# ── AndroidX ─────────────────────────────────────────────────────────────────
activityCompose = "1.11.0"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
coreSplashscreen = "1.0.1"
workManager = "2.10.5"
profileinstaller = "1.4.1"
# Constraint only — this app has no Fragments. See the note in build.gradle.kts.
fragment = "1.8.9"

# ── Google / Firebase ────────────────────────────────────────────────────────
firebaseBom = "34.16.0"
googleServices = "4.5.0"
playServicesWearable = "19.0.0"

# ── Kotlin ecosystem ─────────────────────────────────────────────────────────
coroutines = "1.10.2"
serialization = "1.9.0"

# Tiles' TileService returns a Guava ListenableFuture, so this is a hard
# requirement of the protolayout API rather than a convenience.
guava = "33.4.8-android"

[libraries]
# Compose (BOM-managed)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# Wear Compose — Material 3 line
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }
wear-compose-ui-tooling = { group = "androidx.wear.compose", name = "compose-ui-tooling", version.ref = "wearCompose" }

# Wear platform
wear-core = { group = "androidx.wear", name = "wear", version.ref = "wearCore" }
tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "tiles" }
tiles-material = { group = "androidx.wear.tiles", name = "tiles-material", version.ref = "tiles" }
watchface-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "watchface" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }

# AndroidX
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
# FCM now targets by Installation ID; this is where FirebaseInstallations lives.
firebase-installations = { group = "com.google.firebase", name = "firebase-installations" }

# Kotlin ecosystem
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
